name: Apply 404 and CSP fixes

on:
  push:
    paths:
      - ".github/workflows/patch2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply
        run: |
          cat > /tmp/patch.mjs <<'SCRIPT'
          import fs from "node:fs";

          const edits = [
            {
              file: "src/app/entries/[slug]/page.tsx",
              from: "/** Pre-render every published entry. Drafts are deliberately excluded. */",
              to: "/**\n * The archive is a fixed set. Any slug outside generateStaticParams is a real\n * 404 rather than an on-demand render, which also guarantees that a draft slug\n * can never be served by guessing its URL.\n */\nexport const dynamicParams = false;\n\n/** Pre-render every published entry. Drafts are deliberately excluded. */",
            },
            {
              file: "src/app/categories/[slug]/page.tsx",
              from: "export function generateStaticParams() {\n  return getCategories().map((category) => ({ slug: category.slug }));\n}",
              to: "/** Six categories, fixed. Anything else is a genuine 404, not a soft render. */\nexport const dynamicParams = false;\n\nexport function generateStaticParams() {\n  return getCategories().map((category) => ({ slug: category.slug }));\n}",
            },
            {
              file: "next.config.mjs",
              from: "          {\n            key: \"Permissions-Policy\",\n            value: \"camera=(), microphone=(), geolocation=(), interest-cohort=()\",\n          },",
              to: "          {\n            key: \"Permissions-Policy\",\n            value: \"camera=(), microphone=(), geolocation=(), interest-cohort=()\",\n          },\n          {\n            // The archive loads nothing from anywhere else. 'unsafe-inline' is\n            // required for Next's inline bootstrap script and for the inline\n            // style attributes used throughout the layout; every other source is\n            // locked to self, so an injected tag has nowhere to send data.\n            key: \"Content-Security-Policy\",\n            value: [\n              \"default-src 'self'\",\n              \"script-src 'self' 'unsafe-inline'\",\n              \"style-src 'self' 'unsafe-inline'\",\n              \"img-src 'self' data: blob:\",\n              \"font-src 'self' data:\",\n              \"connect-src 'self'\",\n              \"media-src 'self' blob:\",\n              \"object-src 'none'\",\n              \"base-uri 'self'\",\n              \"form-action 'self'\",\n              \"frame-ancestors 'self'\",\n              \"upgrade-insecure-requests\",\n            ].join(\"; \"),\n          },",
            },
          ];

          let failed = false;
          for (const edit of edits) {
            const text = fs.readFileSync(edit.file, "utf8");
            if (!text.includes(edit.from)) {
              console.error(`MISS ${edit.file}`);
              failed = true;
              continue;
            }
            fs.writeFileSync(edit.file, text.replace(edit.from, edit.to));
            console.log(`OK   ${edit.file}`);
          }
          if (failed) process.exit(1);
          SCRIPT
          node /tmp/patch.mjs

      - name: Type check
        run: |
          npm install 2>&1 | tail -3
          npx tsc --noEmit

      - name: Remove this workflow
        run: rm -f .github/workflows/patch2.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Return genuine 404s for unknown slugs and add a Content-Security-Policy"
          git push
