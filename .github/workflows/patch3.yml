name: Add spectrogramBands

on:
  push:
    paths:
      - ".github/workflows/patch3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply
        run: |
          cat > /tmp/patch.mjs <<'SCRIPT'
          import fs from "node:fs";

          const BANDS = `export interface SpectrogramBand {
  /** Quantised opacity shared by every cell in this band. */
  opacity: number;
  /** One SVG path covering every cell at that opacity. */
  d: string;
}

/**
 * The same spectrogram, but collapsed into one path per opacity band instead of
 * one rect per cell.
 *
 * This matters more than it looks. A 48x14 grid is up to 672 elements, and a
 * page showing twelve of them was serialising roughly half a megabyte of markup
 * plus an even larger React payload describing the identical elements a second
 * time. Quantising opacity into a few bands and emitting one path each drops
 * that to single figures of elements with no visible difference, because the
 * eye cannot resolve 0.61 from 0.63 opacity on an 84px tall figure anyway.
 */
export function spectrogramBands(
  sig: SoundSignature,
  seed: string,
  cols = 48,
  rows = 14,
  bands = 6,
): SpectrogramBand[] {
  const cells = spectrogram(sig, seed, cols, rows);
  const buckets = new Map<number, string[]>();

  for (const cell of cells) {
    // Snap to the nearest band, never to zero, so faint detail survives.
    const step = Math.max(1, Math.round(cell.v * bands));
    const parts = buckets.get(step) ?? [];
    parts.push(\`M\${cell.x} \${cell.y}h\${cell.w}v\${cell.h}h-\${cell.w}Z\`);
    buckets.set(step, parts);
  }

  return [...buckets.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([step, parts]) => ({
      opacity: Number((step / bands).toFixed(2)),
      d: parts.join(""),
    }));
}

`;

          const edits = [
            {
              file: "src/lib/signature.ts",
              from: "/**\n * A plain-language description of the signature for screen readers and for",
              to: BANDS + "/**\n * A plain-language description of the signature for screen readers and for",
            },
            {
              file: "src/components/EntryCard.tsx",
              from: "          variant=\"spectrogram\"\n          height={84}",
              to: "          variant=\"spectrogram\"\n          height={84}\n          // A card figure is 84px tall, so a finer grid would render detail\n          // nobody can see while costing markup on every card in a 12 up list.\n          cols={28}\n          rows={9}",
            },
          ];

          let failed = false;
          for (const edit of edits) {
            const text = fs.readFileSync(edit.file, "utf8");
            if (!text.includes(edit.from)) {
              console.error(`MISS ${edit.file}`);
              failed = true;
              continue;
            }
            fs.writeFileSync(edit.file, text.replace(edit.from, edit.to));
            console.log(`OK   ${edit.file}`);
          }
          if (failed) process.exit(1);
          SCRIPT
          node /tmp/patch.mjs

      - name: Type check and build
        run: |
          npm install 2>&1 | tail -3
          npx tsc --noEmit
          npx next build 2>&1 | tail -15

      - name: Remove this workflow
        run: rm -f .github/workflows/patch3.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Collapse spectrogram cells into opacity bands"
          git push
