name: Apply type-error fixes

# One-shot patch job. Applies the five corrections surfaced by the first real
# tsc run, then deletes itself so it cannot run twice.

on:
  push:
    paths:
      - ".github/workflows/fixup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the corrections
        run: |
          cat > /tmp/fix.mjs <<'SCRIPT'
          import fs from "node:fs";

          const edits = [
            {
              file: "src/app/contributors/page.tsx",
              from: "publishedEntries.filter((e) => e.contributor === contributor.id)",
              to: "publishedEntries.filter((e) =>\n            e.contributorIds.includes(contributor.id),\n          )",
            },
            {
              file: "src/app/entries/[slug]/opengraph-image.tsx",
              from: 'import { sampleAt } from "@/lib/signature";',
              to: 'import { sampleAt, seedFrom } from "@/lib/signature";',
            },
            {
              file: "src/app/entries/[slug]/opengraph-image.tsx",
              from: "    for (let i = 0; i < 64; i += 1) {\n      const value = Math.abs(sampleAt(entry.sound, `${entry.slug}-og`, i / 64));",
              to: "    // Seeded from the slug so the card is byte-stable across rebuilds.\n    let state = seedFrom(`${entry.slug}-og`);\n    const rnd = () => {\n      state = (state + 0x6d2b79f5) >>> 0;\n      let t = state;\n      t = Math.imul(t ^ (t >>> 15), t | 1);\n      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n    for (let i = 0; i < 64; i += 1) {\n      const value = Math.abs(sampleAt(entry.sound, i / 64, rnd));",
            },
            {
              file: "tests/api.test.ts",
              from: "(res.body as { meta: { query: string } }).meta",
              to: "(res.body as unknown as { meta: { query: string } }).meta",
            },
            {
              file: "src/app/categories/[slug]/page.tsx",
              from: "  getSuggestions,\n  getTags,\n  isValidFidelity,",
              to: "  getSuggestions,\n  isValidFidelity,",
            },
            {
              file: "src/lib/api-core.ts",
              from: "    // eslint-disable-next-line no-control-regex\n",
              to: "",
            },
          ];

          let failed = false;
          for (const edit of edits) {
            const text = fs.readFileSync(edit.file, "utf8");
            if (!text.includes(edit.from)) {
              console.error(`MISS ${edit.file}: anchor not found`);
              failed = true;
              continue;
            }
            fs.writeFileSync(edit.file, text.replace(edit.from, edit.to));
            console.log(`OK   ${edit.file}`);
          }
          if (failed) process.exit(1);
          SCRIPT
          node /tmp/fix.mjs

      - name: Verify with the real type checker
        run: |
          npm install 2>&1 | tail -3
          npx tsc --noEmit

      - name: Remove this workflow
        run: rm -f .github/workflows/fixup.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix type errors and lint warnings from the first real compile"
          git push
