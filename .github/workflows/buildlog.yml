name: Capture build log

# Vercel's log viewer truncates the tail of a failing build, which hides the
# actual type error. This runs the identical build in Actions and commits the
# complete output to BUILD_LOG.txt so it can be read directly from the repo.

on:
  push:
    branches: [main]
    paths-ignore:
      - "BUILD_LOG.txt"
      - ".github/workflows/buildlog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buildlog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install 2>&1 | tail -20

      - name: Type check, lint and build, capturing everything
        run: |
          {
            echo "===== tsc --noEmit ====="
            npx tsc --noEmit 2>&1 || echo "[tsc exited $?]"
            echo
            echo "===== next build ====="
            npx next build 2>&1 || echo "[next build exited $?]"
          } > BUILD_LOG.txt
          echo "--- tail of captured log ---"
          tail -60 BUILD_LOG.txt

      - name: Commit the log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f BUILD_LOG.txt
          if git diff --cached --quiet; then
            echo "Log unchanged."
            exit 0
          fi
          git commit -m "CI: capture build log"
          git push
